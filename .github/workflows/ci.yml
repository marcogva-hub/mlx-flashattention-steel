# mlx-mfa CI — runs on macOS arm64 (Apple Silicon) GitHub-hosted runners.
#
# Two job matrix:
#   test-fallback — runs without building the C++ extension (fast, cpu-only runner ok)
#   test-mfa      — builds the extension and runs the full suite (arm64 runner required)
#
# Secrets: none required.

name: CI

on:
  push:
    branches: ["master", "dev"]
  pull_request:
    branches: ["master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Fallback path only — no C++ build, runs on any macOS runner
  # ─────────────────────────────────────────────────────────────────────────
  test-fallback:
    name: "Fallback tests (Python only)"
    runs-on: macos-14  # arm64 (M1)
    strategy:
      fail-fast: false
      matrix:
        # CX-10 (volet D): cover the full declared interpreter range 3.10-3.14.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies (no extension)
        run: |
          pip install --upgrade pip
          pip install mlx numpy pytest

      - name: Make mlx-mfa importable WITHOUT building the extension (deterministic)
        # H-05 FIX (audit 2026-06-21): the prior `pip install -e .` STILL built
        # _ext (it only set the build type), so this job never actually exercised
        # the no-extension fallback.  Put the source tree on PYTHONPATH instead —
        # the Python package imports, `mlx_mfa._ext` is genuinely absent, and the
        # has_nax()/SDPA fallback path is tested for real.
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Assert the extension is genuinely absent
        run: |
          python -c "
          import importlib.util as u
          assert u.find_spec('mlx_mfa') is not None, 'mlx_mfa not importable from source tree'
          import mlx_mfa
          assert not mlx_mfa.has_nax(), 'expected _ext ABSENT in the no-extension job but has_nax()==True'
          print('confirmed: _ext absent, has_nax() == False (SDPA-fallback mode)')
          "

      - name: Run fallback + public API tests
        run: |
          pytest tests/ -v -k "Fallback or PublicAPI" \
            --tb=short --no-header
        env:
          PYTEST_ADDOPTS: "--color=yes"

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Full test suite — builds the C++ extension on Apple Silicon
  #
  # ⚠ M5/NAX COVERAGE GAP (audit H-05 / CC-14). GitHub-hosted `macos-14` is M1,
  # so the M5+/NAX paths (V6 NAX dense forward, V6 split backward, NAX sparse, the
  # which-binary byteΔ fingerprints) SKIP here and are NEVER exercised in CI.
  # ENFORCEMENT (volet D, CX-07): a green hosted-runner CI does NOT certify the M5
  # surface — only the maintainer-run M5 gate does, and `publish.yml` makes a
  # fresh, SHA-matched M5 gate-fingerprint receipt a FATAL precondition for any
  # upload (see release-gate/README.md). The skip-count step below makes the M1
  # skips countable so a lock silently dropping out is caught even though it skips.
  # FLAG-FOR-SIGNOFF (durable): a self-hosted M5 runner that runs the M5 locks +
  # gate directly in CI would close this structurally (also CC-23). Not added —
  # a self-hosted runner on a PUBLIC repo is a security risk (Marco's call).
  # ─────────────────────────────────────────────────────────────────────────
  test-mfa:
    name: "Full MFA tests (Metal kernel)"
    runs-on: macos-14  # arm64 required for Metal GPU (M1 — see M5/NAX gap above)
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install build dependencies
        run: |
          pip install --upgrade pip
          pip install mlx scikit-build-core cmake numpy pytest

      - name: Validate build environment
        run: python scripts/check_env.py

      - name: Build and install C++ extension
        run: |
          pip install -e . --no-build-isolation -v
        timeout-minutes: 10

      - name: Verify extension loads
        run: |
          python -c "
          from mlx_mfa import is_mfa_available, get_device_info
          assert is_mfa_available(), 'MFA extension failed to load'
          info = get_device_info()
          print('Device:', info['device_name'])
          print('Chip:', info['chip_name'])
          print('M3+:', info['is_m3_plus'])
          "

      - name: Run full test suite
        run: |
          pytest tests/ -v --tb=short --no-header
        env:
          PYTEST_ADDOPTS: "--color=yes"

      - name: Check test count (FAIL on collection collapse — L-02)
        run: |
          # H-05/L-02 FIX (audit 2026-06-21): the guard floor was 400 and only
          # WARNED, while ~2120 collect — so a module silently failing to import
          # (collection error → its tests vanish) would never fail CI.  Skips are
          # still COLLECTED, so the floor is safe on the M1 runner.  Make it FATAL
          # with a realistic floor.
          COUNT=$(pytest tests/ --collect-only -q 2>/dev/null | tail -1 | grep -o '[0-9]\+' | head -1)
          echo "Collected $COUNT tests"
          MIN=1800
          if [ -z "$COUNT" ] || [ "$COUNT" -lt "$MIN" ]; then
            echo "::error::test collection collapsed: '$COUNT' < $MIN — a module likely failed to import (collection error). Investigate before merge."
            exit 1
          fi

      - name: M5/NAX lock skip-count visibility (CC-14 / volet D — FATAL)
        run: |
          # The M5-gated correctness locks SKIP on this M1 runner. The frozen
          # marker count (test_release_gate_enforcement::test_m5_skip_marker_count)
          # makes a lock silently dropping out of the suite a CI FAILURE even
          # though it skips. Run it explicitly here for visibility + enforcement.
          pytest tests/test_release_gate_enforcement.py -q
          # Visibility: how many M5 locks actually skipped on this M1 host.
          SKIPPED=$(pytest tests/ -rs -q 2>/dev/null | grep -icE "SKIPPED.*(M5|NAX)" || true)
          echo "::notice::M5/NAX locks skipped on this hosted (M1) runner: $SKIPPED — NOT M5-certified; the publish.yml M5 fingerprint precondition is what certifies the M5 surface."

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Packaging validation — verify sdist contains expected files
  # ─────────────────────────────────────────────────────────────────────────
  test-packaging:
    name: "Packaging validation"
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        # CX-10 (volet D): the source-build-only sdist must build + import on
        # every declared interpreter — that is part of the release contract.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install build tools
        run: pip install --upgrade pip build

      - name: Build sdist
        run: python -m build --sdist

      - name: Verify sdist contents
        run: |
          SDIST=$(ls dist/*.tar.gz)
          echo "Checking: $SDIST"

          # Must contain the metallib
          tar tzf "$SDIST" | grep "async_v2.metallib" \
            && echo "✅ async_v2.metallib found in sdist" \
            || echo "❌ async_v2.metallib MISSING from sdist"

          # Must contain the Metal kernel source
          tar tzf "$SDIST" | grep "async_v2_kernel.metal" \
            && echo "✅ async_v2_kernel.metal found" \
            || echo "❌ async_v2_kernel.metal MISSING"

          # Must contain C++ sources
          tar tzf "$SDIST" | grep "mfa_steel_fwd_v2.cpp" \
            && echo "✅ C++ sources found" \
            || echo "❌ C++ sources MISSING"

          # Count Python files
          PY_COUNT=$(tar tzf "$SDIST" | grep "\.py$" | wc -l)
          echo "Python files in sdist: $PY_COUNT"

          # CX-05 (audit): the "Must contain" greps above are advisory — their
          # `|| echo MISSING` branch exits 0, so a missing .metal/.cpp source did
          # NOT fail the job.  Gate every mandatory source member FATALLY.
          # CC-19 (volet E): async_v2.metallib is TARGET-DEAD on macOS ≥26 / M5
          # (shader_cache.mm returns nullptr there → JIT path) but still used on
          # macOS 14/15, so it remains shipped — its presence is ADVISORY (a
          # warning), NOT fatal, so an M5 release is never blocked by a
          # target-dead artifact. The compile-critical sources stay FATAL.
          for member in async_v2_kernel.metal mfa_steel_fwd_v2.cpp; do
            tar tzf "$SDIST" | grep -q "$member" \
              || { echo "FATAL: $member not in sdist"; exit 1; }
          done
          tar tzf "$SDIST" | grep -q "async_v2.metallib" \
            || echo "::warning::async_v2.metallib absent from sdist — macOS 14/15 lose the precompiled async path (target-dead on M5/≥26, so not fatal)."

      # CX-10 (volet D): the release model is SOURCE-BUILD-ONLY, so "the sdist
      # compiles _ext and imports" is the per-interpreter release contract — test
      # it on every declared Python. Install build deps + the freshly-built sdist
      # in this job's interpreter, then import and verify the has_nax() contract.
      - name: Install the built sdist (compile-at-install) and import
        run: |
          pip install mlx numpy scikit-build-core cmake
          SDIST=$(ls dist/*.tar.gz)
          pip install "$SDIST" -v
          python -c "
          import mlx_mfa
          print('import OK — mlx_mfa', mlx_mfa.__version__, 'on py${{ matrix.python-version }}')
          ok, reason = mlx_mfa.has_nax(reason=True)
          # macos-14 is M1 → NAX never engages; the contract is a CLEAN reason
          # (pre-m5-hardware), NOT an ext-load failure (which would mean the
          # source build/ABI broke on this interpreter).
          assert reason != 'ext-load-failed', f'_ext failed to load on py${{ matrix.python-version }}: {reason}'
          print('has_nax()', ok, '/ reason', reason, '(clean source build + import)')
          "
