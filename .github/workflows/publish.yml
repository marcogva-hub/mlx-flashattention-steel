name: Publish

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Publish target"
        required: true
        type: choice
        options:
          - testpypi
          - pypi

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build release artifacts
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      # T1-2 FIX (audit Codex-H-04, 2026-06-21): SDIST-ONLY publish.  A wheel is
      # ABI-pinned to one machine/Python/MLX build and reintroduces the silent
      # ABI-mismatch class the has_nax()/_check_abi hardening just closed; the
      # decided release model compiles _ext at install from the sdist.  (Flagged
      # for sign-off — release pipeline.)
      - name: Build sdist
        run: python -m build --sdist --outdir dist

      - name: Validate artifacts
        run: python -m twine check dist/*

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: ${{ inputs.repository == 'testpypi' }}
    environment: testpypi
    permissions:
      id-token: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: ${{ inputs.repository == 'pypi' }}
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
