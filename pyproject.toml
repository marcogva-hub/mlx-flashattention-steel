[build-system]
# mlx>=0.31.2: _ext shares MLX's mlx::core::array via nanobind NB_DOMAIN "mlx", whose
# capsule key embeds NB_INTERNALS_VERSION — so _ext must FetchContent the SAME nanobind
# tag MLX was built with. CMakeLists.txt auto-derives that tag from the DETECTED MLX
# version (0.31.2 -> nanobind v2.12.0 / NB_INTERNALS v19; 0.32.0 -> nanobind v2.13.0 /
# NB_INTERNALS v20) and FAILS LOUD on any unmapped MLX (never guesses a tag). 0.31.2 is
# the floor: MLX 0.31.0/0.31.1 ship older nanobind (v17/v18) and would type-share-break.
requires = ["scikit-build-core>=0.9", "mlx>=0.31.2"]
build-backend = "scikit_build_core.build"

[project]
name = "mlx-mfa"
version = "2.62.0"
description = "Benchmark-backed Metal Flash Attention backends for MLX on Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Marco Marcelino"},
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mlx>=0.31.2", "numpy>=1.23"]  # 0.31.2 = nanobind-ABI floor; tag auto-derived per detected MLX (see [build-system] + CMakeLists.txt); numpy floored (L6 audit 2026-06-21)

[project.urls]
"Source Code" = "https://github.com/marcogva-hub/mlx-flashattention-steel"
"Bug Tracker" = "https://github.com/marcogva-hub/mlx-flashattention-steel/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-benchmark"]

[tool.scikit-build]
cmake.version = ">=3.24"
cmake.build-type = "Release"
wheel.packages = ["mlx_mfa"]

# v2.58.1 P3 — EXPLICIT sdist surface (the old MANIFEST.in was inert under
# scikit-build-core and was deleted). scikit-build-core's sdist base = git-tracked
# files + untracked-non-gitignored files; these excludes drop the dev/CI cruft that
# shipped in 2.58.0 (bench/, benchmarks/ incl .log) and any local scratch. The
# intentional publication set is: the 3 LICENSE files + the root docs
# (README/CHANGELOG/NAMING/RESULTS/ENV_VARS/CLAUDE*) + CMakeLists + pyproject +
# csrc/** + mlx_mfa/** + examples/** + tests/** + docs/reference/**. The built-sdist
# guard (tests/test_publish_surface_guard.py) enforces this allowlist on the real tarball.
[tool.scikit-build.sdist]
# CX-07 (volet E2): the three orphaned sources async_v2_noasm.metal,
# kernels/attention_forward.metal (JIT-era placeholder), and mfa/DeviceProperties.hpp
# (unused struct) are now REMOVED from the tracked tree (verified 0 build/source/
# test/CMake/script refs) — no longer excluded here because they no longer exist.
# csrc/mpp_int8_bench.mm is KEPT (referenced by CMakeLists under MFA_BUILD_PROBES).
# CC-07 (volet E3, maintainer signoff 2026-06-23): CLAUDE.md / CLAUDE_V6_NAX.md are
# internal engineering docs — excluded from the published sdist (user-facing only).
exclude = ["bench", "benchmarks", "devnotes", "release-gate", "audit", ".claude", ".github", ".gitignore", "*.log", "**/__pycache__",
           "CLAUDE.md", "CLAUDE_V6_NAX.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
