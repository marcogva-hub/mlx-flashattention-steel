[build-system]
# mlx>=0.31.2: the _ext extension links nanobind v2.12.0 (NB_INTERNALS v19) — see the
# NB_INTERNALS_VERSION→MLX mapping in CMakeLists.txt. MLX 0.31.0/0.31.1 ship an older
# nanobind (v17/v18); the capsule key embeds NB_INTERNALS_VERSION, so a 0.31.0/.1 user
# would compile an incompatible _ext and hit a silent NB_DOMAIN "mlx" type-sharing
# mismatch at import. 0.31.2 is the real floor (was an inaccurate >=0.31.0).
requires = ["scikit-build-core>=0.9", "mlx>=0.31.2"]
build-backend = "scikit_build_core.build"

[project]
name = "mlx-mfa"
version = "2.60.0"
description = "Benchmark-backed Metal Flash Attention backends for MLX on Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Marco Marcelino"},
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mlx>=0.31.2", "numpy"]  # 0.31.2 = nanobind 2.12.0 ABI floor (see [build-system])

[project.urls]
"Source Code" = "https://github.com/marcogva-hub/mlx-flashattention-steel"
"Bug Tracker" = "https://github.com/marcogva-hub/mlx-flashattention-steel/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-benchmark"]

[tool.scikit-build]
cmake.version = ">=3.24"
cmake.build-type = "Release"
wheel.packages = ["mlx_mfa"]

# v2.58.1 P3 — EXPLICIT sdist surface (the old MANIFEST.in was inert under
# scikit-build-core and was deleted). scikit-build-core's sdist base = git-tracked
# files + untracked-non-gitignored files; these excludes drop the dev/CI cruft that
# shipped in 2.58.0 (bench/, benchmarks/ incl .log) and any local scratch. The
# intentional publication set is: the 3 LICENSE files + the root docs
# (README/CHANGELOG/NAMING/RESULTS/ENV_VARS/CLAUDE*) + CMakeLists + pyproject +
# csrc/** + mlx_mfa/** + examples/** + tests/** + docs/reference/**. The built-sdist
# guard (tests/test_publish_surface_guard.py) enforces this allowlist on the real tarball.
[tool.scikit-build.sdist]
exclude = ["bench", "benchmarks", ".claude", ".github", ".gitignore", "*.log", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
