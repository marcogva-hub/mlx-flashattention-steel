[build-system]
# mlx>=0.31.2,<=0.32.2: _ext shares MLX's mlx::core::array via nanobind NB_DOMAIN "mlx",
# whose capsule key embeds NB_INTERNALS_VERSION — so _ext must FetchContent the SAME
# nanobind tag MLX was built with. csrc/cmake/MlxNanobindAbi.cmake maps each VERIFIED MLX
# release (0.31.2 -> v2.12.0; 0.32.0/0.32.1 -> v2.13.0; 0.32.2 -> v2.15.0) and FAILS LOUD
# on anything else. The CAP is mandatory (BLD-01, 2.62.1): pip's build isolation resolves
# the LATEST allowed MLX, so an uncapped floor broke `pip install mlx-mfa` the day MLX
# shipped an unmapped release. Raise the cap only together with a new verified table entry
# (tests/test_mlx_nanobind_abi_mapping.py locks cap == top of table, in BOTH lists).
# 0.31.2 is the floor: MLX 0.31.0/0.31.1 ship older nanobind (v17/v18).
requires = ["scikit-build-core>=0.9", "mlx>=0.31.2,<=0.32.2"]
build-backend = "scikit_build_core.build"

[project]
name = "mlx-mfa"
version = "2.64.0"
description = "Benchmark-backed Metal Flash Attention backends for MLX on Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Marco Marcelino"},
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mlx>=0.31.2,<=0.32.2", "numpy>=1.23"]  # MUST equal the [build-system] mlx specifier (floor = nanobind-ABI floor, cap = top of csrc/cmake/MlxNanobindAbi.cmake); numpy floored (L6 audit 2026-06-21)

[project.urls]
"Source Code" = "https://github.com/marcogva-hub/mlx-flashattention-steel"
"Bug Tracker" = "https://github.com/marcogva-hub/mlx-flashattention-steel/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-benchmark"]

[tool.scikit-build]
cmake.version = ">=3.24"
cmake.build-type = "Release"
wheel.packages = ["mlx_mfa"]

# v2.58.1 P3 — EXPLICIT sdist surface (the old MANIFEST.in was inert under
# scikit-build-core and was deleted). scikit-build-core's sdist base = git-tracked
# files + untracked-non-gitignored files; these excludes drop the dev/CI cruft that
# shipped in 2.58.0 (bench/, benchmarks/ incl .log) and any local scratch. The
# intentional publication set is: the 3 LICENSE files + the root docs
# (README/CHANGELOG/NAMING/RESULTS/ENV_VARS/CLAUDE*) + CMakeLists + pyproject +
# csrc/** + mlx_mfa/** + examples/** + tests/** + docs/reference/**. The built-sdist
# guard (tests/test_publish_surface_guard.py) enforces this allowlist on the real tarball.
[tool.scikit-build.sdist]
# CX-07 (volet E2): the three orphaned sources async_v2_noasm.metal,
# kernels/attention_forward.metal (JIT-era placeholder), and mfa/DeviceProperties.hpp
# (unused struct) are now REMOVED from the tracked tree (verified 0 build/source/
# test/CMake/script refs) — no longer excluded here because they no longer exist.
# CC-07 (volet E3, maintainer signoff 2026-06-23): CLAUDE.md / CLAUDE_V6_NAX.md are
# internal engineering docs — excluded from the published sdist (user-facing only).
# 2.62.2 (review 2026-09, A10, maintainer decision): per-FILE dev-only exclusions —
# kept in the repository, not published. scikit-build-core also applies this list to
# the wheel's package files. Mirrored by _DEV_ONLY_FILES in
# tests/test_publish_surface_guard.py (per-file lock, both artifacts).
#   historical, not loaded (async_v2 retired in 2.62.2):
#     csrc/async_v2_kernel.metal, scripts/build_async_metallib.sh
#   compiled/runnable only with -DMFA_BUILD_PROBES=ON (no workflow sets it):
#     the 3 probe sources + tests/test_varlen_source_generation_guards.py
#   campaign/dev scripts no shipped test imports:
#     audit_dispatch_grouping_k0.py, audit_dit_dispatch.py, build_metallibs.sh
#   own kernels kept for the record, never wired into dispatch (+ their tests):
#     mlx_mfa/gqa_decode_cider.py (Op-H, parity), mlx_mfa/topk_stream.py (declined)
exclude = ["bench", "benchmarks", "devnotes", "release-gate", "audit", ".claude", ".github", ".gitignore", "*.log", "**/__pycache__",
           "CLAUDE.md", "CLAUDE_V6_NAX.md",
           "csrc/async_v2_kernel.metal", "scripts/build_async_metallib.sh",
           "csrc/mpp_int8_bench.mm", "csrc/v6_nax_primitives_probe.cpp", "csrc/v6_nax_toolchain_probe.cpp",
           "tests/test_varlen_source_generation_guards.py",
           "scripts/audit_dispatch_grouping_k0.py", "scripts/audit_dit_dispatch.py", "scripts/build_metallibs.sh",
           "mlx_mfa/gqa_decode_cider.py", "mlx_mfa/topk_stream.py",
           "tests/test_phase2_ii11_gqa_decode_cider.py", "tests/test_phase2_ii3_topk_stream.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
